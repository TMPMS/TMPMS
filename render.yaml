services:
  - type: web
    name: tmpms-backend
    env: node
    buildCommand: npm install
    startCommand: node server.cjs
    envVars:
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tmpms.vercel.app
